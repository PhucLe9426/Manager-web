services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: siteops
      POSTGRES_USER: siteops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siteops_dev_change}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteops -d siteops"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: siteops-manager:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://siteops:${POSTGRES_PASSWORD:-siteops_dev_change}@db:5432/siteops
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: siteops-manager:local
    restart: unless-stopped
    command: ["node", "scripts/worker.mjs"]
    environment:
      DATABASE_URL: postgres://siteops:${POSTGRES_PASSWORD:-siteops_dev_change}@db:5432/siteops
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-360}
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  postgres_data:
